# World Line web：前端靜態檔＋SPA fallback，/api → api、/tiles/* → martin、/tiles/overlay.json 靜態。
# TLS 在 Cloudflare 終止；cloudflared 以 HTTP 連 127.0.0.1，原始協定由 X-Forwarded-Proto 帶入。
map $http_x_forwarded_proto $wl_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/x-protobuf application/vnd.mapbox-vector-tile;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker 健康檢查用（不經 api）
    location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }

    # 下方 proxy_pass 用變數＋resolver：上游容器重建換 IP 時不必重啟 nginx
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_up http://api:8080;
    set $martin_up http://martin:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $wl_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    # 健康檢查：API 的 /healthz（/api/healthz 也接受）
    location = /healthz     { proxy_hide_header Cache-Control; add_header Cache-Control "no-store" always; proxy_pass $api_up/healthz; }
    location = /api/healthz { proxy_hide_header Cache-Control; add_header Cache-Control "no-store" always; proxy_pass $api_up/healthz; }

    location /api/ {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_pass $api_up;
    }

    # overlay 中繼資料：overlay.json 不快取（指向最新版本），overlay-v{hash}.json 永久快取
    location = /tiles/overlay.json {
        alias /srv/tiles/overlay.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }
    location ~ ^/tiles/(overlay-v[0-9a-f]+\.json)$ {
        alias /srv/tiles/$1;
        default_type application/json;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # TileJSON：短快取（換版時 5 分鐘內生效）
    location ~ ^/tiles/(boundaries|overlay)$ {
        add_header Cache-Control "public, max-age=300" always;
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass $martin_up;
    }
    # 圖磚本體
    location ~ ^/tiles/(boundaries|overlay)/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass $martin_up;
    }
    location /tiles/ { return 404; }

    # 帶 hash 的 js/css 永久快取
    location ~ "-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ES module（MapLibre worker 等）：nginx 預設 mime.types 無 .mjs，需明確指定，否則回 application/octet-stream
    location ~* \.mjs$ {
        types {}
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # SPA：其餘（index.html、前端路由、未帶 hash 的檔案）每次以 ETag 驗證
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
