# World Line 正式版（Tai 2026-11-04：正式機用 Caddy，包進 docker compose）
# 與開發用 compose.yaml 完全分開：專案名 worldline-prod，volume 前綴 worldline-prod_。
# 只有 caddy 對外開 80/443；postgres、redis、api、martin 只在內部網路。
# 用法：cp .env.example .env（填值）→ docker compose -f docker-compose.prod.yml up -d --build
name: worldline-prod

services:
  postgres:
    # 與開發庫同版本：PostgreSQL 18.6 / PostGIS 3.6.4（上線前用 SELECT postgis_full_version() 核對）
    image: ${WL_POSTGIS_IMAGE:-postgis/postgis:18-3.6}
    environment:
      POSTGRES_DB: ${WL_PROD_DB:-worldline}
      POSTGRES_USER: ${POSTGRES_USER:?請在 .env 設定 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ${WL_RESTORE_DIR:-./deploy/restore}:/restore:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  redis:
    # 預留給 API 快取／速率限制（目前 API 尚未使用；不對外）
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__WorldLine: Host=postgres;Port=5432;Database=${WL_PROD_DB:-worldline};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      WORLDLINE_API_KEY: ${WORLDLINE_API_KEY:-}
      WORLDLINE_BOUNDARY_SOURCE: tiles
      WORLDLINE_MIGRATE_ON_STARTUP: ${WORLDLINE_MIGRATE_ON_STARTUP:-false}
      WORLDLINE_PREWARM_DATE: ${WORLDLINE_PREWARM_DATE:-}
      WORLDLINE_CACHE_MAX_MB: ${WORLDLINE_CACHE_MAX_MB:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  martin:
    # 只提供 PMTiles（boundaries、overlay），不連資料庫；base_path 讓 TileJSON 的圖磚網址是 /tiles/...
    image: ${WL_MARTIN_IMAGE:-ghcr.io/maplibre/martin:1.16.1}
    command: ["--config", "/config/martin.yaml"]
    volumes:
      - ./deploy/martin.prod.yaml:/config/martin.yaml:ro
      - ${WL_TILES_DIR:-./tools/tiles/out}:/data:ro
    networks: [internal]
    restart: unless-stopped

  caddy:
    # 前端 production build 靜態檔＋Caddy（自動 HTTPS）；Dockerfile 在 deploy/Dockerfile.web
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    environment:
      WL_DOMAIN: ${WL_DOMAIN:?請在 .env 設定 WL_DOMAIN（例 worldline.example.com；本機測試用 localhost）}
    ports:
      - "${WL_HTTP_PORT:-80}:80"
      - "${WL_HTTPS_PORT:-443}:443"
      - "${WL_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${WL_TILES_DIR:-./tools/tiles/out}:/srv/tiles:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [api, martin]
    networks: [internal, public]
    restart: unless-stopped

networks:
  internal:
    internal: true
  public: {}

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
