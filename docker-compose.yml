services:
  # 1. PostgreSQL + PostGIS 資料庫
  postgres:
    image: postgis/postgis:16-3.4
    container_name: app_postgres
    restart: always
    env_file:
      .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 快取
  redis:
    image: redis:7-alpine
    container_name: app_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. C# .NET 後端 API
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: app_backend
    restart: always
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
      - ConnectionStrings__Redis=redis:6379
    ports:
      - "5050:8080" # 原本 5000——macOS AirPlay 接收器預設佔用該 port（回應 Server: AirTunes），改用不常衝突的 5050
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # 4. Angular 前端 (通常以 Nginx 反向代理或打包靜態檔)
  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app_frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:

networks:
  app_network:
    driver: bridge
