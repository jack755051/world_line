@if (focusedRegimeId(); as id) {
  <aside class="regime-focus-panel" aria-label="政權聚焦資訊">
    <header class="regime-focus-panel-header">
      <h2>{{ focusedRegimeName() }}</h2>
      <button type="button" class="regime-focus-panel-close" (click)="close()" aria-label="關閉聚焦模式">✕</button>
    </header>

    @if (outOfLifetimeWarning(); as warning) {
      <p class="regime-focus-panel-warning">{{ warning }}</p>
    }

    <sanring-collapsible [open]="true" class="regime-focus-panel-collapsible">
      <button type="button" sanringCollapsibleTrigger class="regime-focus-panel-section-trigger">
        <span>同時期周邊政權</span>
        <span class="regime-focus-panel-chevron" aria-hidden="true">▾</span>
      </button>

      <div sanringCollapsibleContent>
        @if (neighborNames().length > 0) {
          <ul class="regime-focus-panel-neighbor-list">
            @for (name of neighborNames(); track name) {
              <li>{{ name }}</li>
            }
          </ul>
        } @else {
          <p class="regime-focus-panel-empty">這個年份沒有查到相鄰的政權</p>
        }
      </div>
    </sanring-collapsible>
  </aside>
}
