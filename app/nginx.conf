server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 有內容雜湊的檔名（main-XXXX.js、styles-XXXX.css）可以放心快取到天長地久——
    # 內容一變檔名就變，不會有「快取到舊內容」的問題。
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 沒有雜湊檔名，一定要每次都跟伺服器確認是不是最新的，不然瀏覽器快取
    # 到舊版 index.html（裡面 <script> 指到舊的雜湊檔名）之後，改版把舊檔名的資源
    # 從新映像檔裡拿掉，瀏覽器拿著舊 index.html 去要舊檔名的 .js，nginx 的 SPA
    # fallback（下面 try_files 那行）找不到就回傳 index.html 本身（text/html），
    # 瀏覽器對 <script type="module"> 做 MIME type 檢查就會報錯——這正是這次踩到的
    # 那個 bug 的根因，不是瀏覽器快取隨便清一次就好，是伺服器本來就該告訴瀏覽器
    # 「這個檔案不要快取」。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
