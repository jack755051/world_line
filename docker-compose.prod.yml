# World Line 正式版（Tai 2026-11-04：對齊 sanring_tech_site）
# 本機建 linux/amd64 映像推 registry → VPS 只 pull；服務只綁 127.0.0.1，對外走 Cloudflare Tunnel（TLS 在 CF 終止）。
# 對外只有 web（127.0.0.1:${WEB_PORT}）：nginx 提供前端靜態檔＋SPA fallback，並在容器內轉 /api → api、/tiles/* → martin。
# api、postgres、redis、martin 只在內部網路，不綁任何主機埠。
# 複製：cp env.prod.example .env.prod
# 使用：docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
name: ${COMPOSE_PROJECT_NAME:-worldline-prod}

services:
  postgres:
    # 與開發庫同版本：PostgreSQL 18.6 / PostGIS 3.6.4（還原前用 SELECT postgis_full_version() 核對）
    image: ${POSTGIS_IMAGE:-postgis/postgis:18-3.6}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-worldline}
      POSTGRES_USER: ${POSTGRES_USER:?請在 .env.prod 設定 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env.prod 設定 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ${RESTORE_DIR:-./restore}:/restore:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  redis:
    # 預留給 API 快取／速率限制（目前 API 尚未使用；不對外）
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-registry.digitalocean.com/sanring/worldline-api}:${API_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__WorldLine: Host=postgres;Port=5432;Database=${POSTGRES_DB:-worldline};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      WORLDLINE_API_KEY: ${WORLDLINE_API_KEY:-}
      WORLDLINE_BOUNDARY_SOURCE: tiles
      WORLDLINE_MIGRATE_ON_STARTUP: ${WORLDLINE_MIGRATE_ON_STARTUP:-false}
      WORLDLINE_PREWARM_DATE: ${WORLDLINE_PREWARM_DATE:-}
      WORLDLINE_CACHE_MAX_MB: ${WORLDLINE_CACHE_MAX_MB:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  martin:
    # 只提供 PMTiles（boundaries、overlay），不連資料庫；設定內嵌在本檔（VPS 只需 compose＋.env.prod）
    image: ${MARTIN_IMAGE:-ghcr.io/maplibre/martin:1.16.1}
    command: ["--config", "/config/martin.yaml"]
    configs:
      - source: martin
        target: /config/martin.yaml
    volumes:
      - ${TILES_DIR:-./tiles}:/data:ro
    networks: [internal]
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-jackdai850817/worldline-web}:${WEB_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      # 只綁本機；Cloudflare Tunnel 指到 http://127.0.0.1:${WEB_PORT}（與 sanring 4000/4001/5000 不衝突）
      - "127.0.0.1:${WEB_PORT:-4080}:80"
    volumes:
      # overlay.json（與 overlay-v{hash}.json）由 nginx 直接當靜態檔提供
      - ${TILES_DIR:-./tiles}:/srv/tiles:ro
    depends_on: [api, martin]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal, public]
    restart: unless-stopped

configs:
  martin:
    content: |
      listen_addresses: '0.0.0.0:3000'
      # TileJSON 內的圖磚網址帶 /tiles 前綴（web 的 nginx 轉發時去掉 /tiles）
      base_path: /tiles
      pmtiles:
        sources:
          boundaries: /data/boundaries.pmtiles
          overlay: /data/overlay.pmtiles

networks:
  internal:
    internal: true
  public: {}

volumes:
  pgdata:
  redisdata:
