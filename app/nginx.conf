server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # proxy_pass 故意不帶結尾斜線的路徑（只有 `http://backend:8080`，沒有再接 `/`）——
    # nginx 的規則是：proxy_pass 目標有帶路徑（哪怕只是 `/`）就會把 location 比對到的
    # 前綴（這裡是 `/api/`）從轉發出去的網址裡砍掉；沒帶路徑就整條原始 URI 原封不動轉發。
    # 後端 controller 的路由本身就是 `/api/v1/...`（例如 `[Route("api/v1")]`），不是
    # `/v1/...`，砍掉 `/api/` 前綴會讓每個請求都對不上路由、全部 404——這是實際測出來的
    # bug，不是理論推測（`curl localhost:4200/api/v1/territories` 曾經真的回 404，
    # 直接對後端 container 打 `/api/v1/territories` 卻是 200，兩者唯一差異就是有沒有
    # 經過這段 proxy）。
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 有內容雜湊的檔名（main-XXXX.js、styles-XXXX.css）可以放心快取到天長地久——
    # 內容一變檔名就變，不會有「快取到舊內容」的問題。
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # MapLibre GL 的 web worker（maplibre-gl-worker.mjs）是瀏覽器用
    # `new Worker(url, {type: "module"})` 動態載入的真的 ES module 原始碼，不是
    # esbuild 打包過的東西——它自己內部又用相對路徑 `import` 了另一個 sibling chunk
    # （maplibre-gl-shared.mjs），瀏覽器會照這個 import 路徑再發一次獨立請求，不會
    # 因為前一支修好了就沒事，兩支檔案都要存在才行（見 angular.json assets 設定，
    # 已把這兩個檔名從 node_modules/maplibre-gl/dist 複製進 build output）。用正規表達式
    # 統一處理「任何 .mjs 檔案」而不是逐一列檔名——這類「函式庫自帶原始碼、不進打包
    # 流程」的裸檔案，之後升級 maplibre-gl 版本或引入其他有 worker 的函式庫都可能再
    # 出現同一種檔案，用同一條規則涵蓋，不用每次多一個檔名就回來改一次 nginx.conf。
    #
    # 這兩支檔名固定不隨內容變動（不像 main-XXXX.js 那樣雜湊），所以套用
    # `no-cache, must-revalidate`（跟 index.html 同一個道理），不能套用上面雜湊檔名
    # 那條「放心快取一年」的規則，不然下次升級 maplibre-gl 版本，瀏覽器會一直吃到
    # 升級前的舊版程式碼。
    #
    # 另外這裡踩到的一個坑：nginx 內建的 mime.types 沒有 .mjs（ES module 副檔名）的
    # 對照，不設定的話會 fall back 到 application/octet-stream——瀏覽器對
    # module worker／module import 一樣做嚴格 MIME type 檢查，型別不對一樣會被拒絕，
    # 檔案存在也沒用。用 `default_type` 而不是外面包一個 types{} 區塊——試過在
    # `types { include mime.types; ... }` 裡追加一筆想「沿用標準表+加一筆」，結果
    # mime.types 這個檔案本身就是用 `types { ... }` 包起來的一整個檔案，巢狀 include
    # 直接讓 nginx 整個啟動失敗（"unexpected '{' in mime.types:2"），改用範圍限定在
    # 這個 location 的 `default_type` 才對。
    location ~* \.mjs$ {
        try_files $uri =404;
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 任務 3.17：地圖陸地底圖（ne_50m_land.geojson，見 app/public/、map.ts）——跟
    # 上面 .mjs 那組是同一類「函式庫/資料自帶原始檔、沒有內容雜湊檔名」的情況，用
    # no-cache 避免以後更新這個檔案時瀏覽器一直吃到舊版本；nginx 內建 mime.types
    # 沒有 .geojson 對照，一樣會 fall back 成 application/octet-stream，用
    # default_type 明確設對（MapLibre／`fetch().json()` 實際上不檢查這個 header，
    # 這裡設對純粹是資料正確性/未來其他消費端的衛生習慣，不是修一個真的功能性 bug）。
    location ~* \.geojson$ {
        try_files $uri =404;
        default_type application/geo+json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # index.html 沒有雜湊檔名，一定要每次都跟伺服器確認是不是最新的，不然瀏覽器快取
    # 到舊版 index.html（裡面 <script> 指到舊的雜湊檔名）之後，改版把舊檔名的資源
    # 從新映像檔裡拿掉，瀏覽器拿著舊 index.html 去要舊檔名的 .js，nginx 的 SPA
    # fallback（下面 try_files 那行）找不到就回傳 index.html 本身（text/html），
    # 瀏覽器對 <script type="module"> 做 MIME type 檢查就會報錯——這正是這次踩到的
    # 那個 bug 的根因，不是瀏覽器快取隨便清一次就好，是伺服器本來就該告訴瀏覽器
    # 「這個檔案不要快取」。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
