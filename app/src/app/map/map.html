<div #mapContainer class="map-container"></div>

@if (territoryLoadState() === 'loading') {
  <div class="map-loading-overlay" aria-live="polite">
    <p class="map-loading-text">地圖載入中…</p>
  </div>
}

@if (territoryLoadState() === 'error') {
  <div class="map-status-banner map-status-banner-error" role="alert">
    <span>疆域資料載入失敗</span>
    <button type="button" class="map-status-retry" (click)="retryLoadTerritories()">重試</button>
  </div>
} @else if (isTerritoriesEmpty()) {
  <div class="map-status-banner">
    <span>這個年份查無政權疆域資料</span>
  </div>
}
