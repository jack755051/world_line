# World Line（二戰階段）本機開發環境：PostGIS＋api（web 待 M0 前端，A9 Stitch 畫面定稿後加入）
# 與舊的 docker-compose.yml（app_* 容器、postgres_data volume、appdb）完全分開：
#   - 專案名固定為 worldline-ww2，volume 為 worldline-ww2_pgdata
#   - 預設資料庫 appdb_ww2；埠只綁 127.0.0.1，預設 5433（DB）／5051（API），避開舊環境的 5432／5050
# 用法：cp .env.example .env（填密碼與 API key）→ docker compose up -d --build
name: worldline-ww2

services:
  postgres:
    image: postgis/postgis:18-3.6
    # 官方 postgis 映像只發佈 linux/amd64；Apple Silicon 以模擬執行（舊環境的 16-3.4 亦同）
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${WW2_POSTGRES_DB:-appdb_ww2}
      POSTGRES_USER: ${POSTGRES_USER:?請在 .env 設定 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${WW2_DB_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 官方映像的資料目錄改為 /var/lib/postgresql/18/docker，掛載點用上層目錄
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__WorldLine: Host=postgres;Port=5432;Database=${WW2_POSTGRES_DB:-appdb_ww2};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      WORLDLINE_API_KEY: ${WORLDLINE_API_KEY:-}
      # 啟動時套用 migration（只新增，不刪資料；Down 一律不支援）
      WORLDLINE_MIGRATE_ON_STARTUP: "true"
    ports:
      - "127.0.0.1:${WW2_API_PORT:-5051}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
