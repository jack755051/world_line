server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 有內容雜湊的檔名（main-XXXX.js、styles-XXXX.css）可以放心快取到天長地久——
    # 內容一變檔名就變，不會有「快取到舊內容」的問題。
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # maplibre-gl-worker.mjs 是從 node_modules 原封不動複製過來的固定檔名（見
    # angular.json assets 設定），不像 main-XXXX.js 那樣內容變了檔名就變——之後升級
    # maplibre-gl 版本，這個檔案內容會變但檔名不變，不能套用上面雜湊檔名那條「放心
    # 快取一年」的規則，不然瀏覽器會一直用到升級前的舊版worker。比照 index.html 的
    # 處理方式：每次都要跟伺服器確認。
    #
    # 另外這裡踩到的第二個坑：nginx 內建的 mime.types 沒有 .mjs（ES module 副檔名）的
    # 對照，不設定的話會 fall back 到 application/octet-stream——瀏覽器對
    # `new Worker(url, {type: "module"})` 動態載入的 module worker 一樣做嚴格 MIME
    # type 檢查，application/octet-stream 一樣會被拒絕，檔案存在但型別不對一樣不能用。
    # 用 `default_type` 而不是外面包一個 types{} 區塊——這個 location 本來就只服務
    # 這一個檔案，不需要完整 mime 對照表，直接指定型別最簡單；試過在 types{} 裡面
    # `include mime.types;` 想「沿用標準表+追加一筆」，結果 mime.types 這個檔案本身
    # 就是用 `types { ... }` 包起來的，巢狀 include 直接讓 nginx 整個啟動失敗
    # （"unexpected '{' in mime.types:2"），改用這個寫法才對。
    location = /maplibre-gl-worker.mjs {
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # index.html 沒有雜湊檔名，一定要每次都跟伺服器確認是不是最新的，不然瀏覽器快取
    # 到舊版 index.html（裡面 <script> 指到舊的雜湊檔名）之後，改版把舊檔名的資源
    # 從新映像檔裡拿掉，瀏覽器拿著舊 index.html 去要舊檔名的 .js，nginx 的 SPA
    # fallback（下面 try_files 那行）找不到就回傳 index.html 本身（text/html），
    # 瀏覽器對 <script type="module"> 做 MIME type 檢查就會報錯——這正是這次踩到的
    # 那個 bug 的根因，不是瀏覽器快取隨便清一次就好，是伺服器本來就該告訴瀏覽器
    # 「這個檔案不要快取」。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
