# 開發用：提供 tools/tiles/out 的 overlay JSON（§9 步驟 5）。正式環境由 CDN 提供同一批檔案。
server {
  listen 80;
  root /data;
  gzip on;
  gzip_types application/json;
  add_header Access-Control-Allow-Origin * always;
  location = /overlay.json { add_header Cache-Control "no-cache" always; add_header Access-Control-Allow-Origin * always; }
  location ~ ^/overlay-v[0-9a-f]+\.json$ { add_header Cache-Control "public, max-age=31536000, immutable" always; add_header Access-Control-Allow-Origin * always; }
  location / { return 404; }
}
