<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>戰役動態地圖</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=2.10.0">
<link rel="icon" href="data:,">
</head>
<body>
<!-- 過場遮蓋：頁面一開始就蓋著紙色，等戰役全部準備好才淡出；切換戰役時先淡入再換頁，不會看到載入到一半的畫面。樣式寫在這裡，不等 style.css -->
<style>#veil{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:#fbfaf6;color:#26201c;font:900 30px/1.2 "Noto Serif TC","Noto Serif CJK TC","Songti TC",serif;letter-spacing:.04em;opacity:1;transition:opacity .28s ease}#veil.off{opacity:0;pointer-events:none}@media (prefers-reduced-motion:reduce){#veil{transition:none}}</style>
<div id="veil" aria-hidden="true"></div>
<div id="app">
  <header id="hud-top">
    <div class="hd-main">
      <div class="hd-title"><div id="battle-nav" role="group" aria-label="切換戰役"><button id="bt-prev" class="bt-arrow" aria-label="上一場戰役">▲</button><h1 id="battle-title"><button id="bt-title" aria-haspopup="true" aria-expanded="false" title="戰役清單"></button></h1><span id="bt-info" tabindex="0" role="note" hidden><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="7.25" y="7" width="1.5" height="4.6" fill="currentColor"/><circle cx="8" cy="4.9" r="0.95" fill="currentColor"/></svg><span id="banner"></span></span><button id="bt-next" class="bt-arrow" aria-label="下一場戰役">▼</button><nav id="bt-menu" hidden aria-label="戰役清單"></nav></div></div>
      <div id="date-block" aria-live="polite">
        <div id="date-main"><span id="date-d"></span><span id="date-hr"></span></div>
        <div id="date-sub"><span id="phase"></span><span id="interp" hidden>位置內插・推估</span></div>
      </div>
    </div>
    <nav id="layers" aria-label="模式、視角與圖層"></nav>
    <div id="hud-btns"><button id="oob-btn" aria-expanded="false" aria-controls="oob">清單</button><button id="legend-btn" aria-expanded="false" aria-controls="legend">圖例</button></div>
  </header>
  <aside id="rail">
    <section id="now" aria-label="此刻的交戰"></section>
    <aside id="oob" hidden aria-label="章節、部隊與交戰清單">
      <button id="oob-close" aria-label="關閉清單">×</button>
      <div id="oob-body"></div>
    </aside>
  </aside>
  <main id="map-wrap">
    <div id="map" role="application" aria-label="戰役動態地圖"></div>
    <div id="pk-tags" aria-hidden="true"></div>
    <div id="eng-tags" aria-hidden="true"></div>
    <div id="tip" hidden></div>
    <button id="follow" hidden title="回到自動鏡頭（快捷鍵 F）">◎ 跟隨鏡頭</button>
    <div id="event" aria-hidden="true"><div class="ev-zh"></div><div class="ev-rule"></div><div class="ev-en"></div></div>
    <aside id="legend" hidden>
      <div class="lg-title">圖例 <button id="legend-close" aria-label="關閉圖例">×</button></div>
      <div class="lg-sec" id="lg-sides"></div>
      <div id="lg-branch"></div>
      <div class="lg-row"><i class="sw sw-pips"></i>牌子下的小點＝層級：1 旅、2 師、3 軍、4 集團軍</div>
      <div class="lg-row"><i class="sw sw-head"></i>短箭頭＝正往下一個紀錄點移動</div>
      <div class="lg-row"><i class="sw sw-trail"></i>選取部隊的航跡（虛線＝之後）</div>
      <div class="lg-sec">交戰</div>
      <div class="lg-row"><i class="sw sw-e3"></i>關鍵交戰：光圈、名稱、連到參戰部隊</div>
      <div class="lg-row"><i class="sw sw-e2"></i>重要交戰：細環＋名稱</div>
      <div class="lg-row"><i class="sw sw-e1"></i>一般交戰：小圓點，滑過才展開</div>
      <div class="lg-sec">控制區</div>
      <div class="lg-row"><i class="sw sw-axis"></i><span id="lg-axis"></span></div>
      <div class="lg-row"><i class="sw sw-allied"></i><span id="lg-allied"></span></div>
      <div class="lg-row"><i class="sw sw-front"></i>前線、包圍圈</div>
      <div class="lg-note" id="lg-note"></div>
    </aside>
    <aside id="info" hidden>
      <button id="info-close" aria-label="關閉">×</button>
      <div id="info-body"></div>
    </aside>
  </main>
  <footer id="timeline">
    <div id="tl-controls">
      <button id="btn-prev" aria-label="上一個關鍵日">⏮</button>
      <button id="btn-play" aria-label="播放">▶</button>
      <button id="btn-next" aria-label="下一個關鍵日">⏭</button>
      <div id="speed" role="group" aria-label="速度">
        <button data-s="0.25" title="每秒 6 小時">6時/秒</button><button data-s="1" class="on" title="每秒 1 天">1日/秒</button><button data-s="3" title="每秒 3 天">3日/秒</button>
      </div>
    </div>
    <div id="tl-track-wrap">
      <div id="tl-chip"></div>
      <div id="tl-track" role="slider" tabindex="0" aria-label="日期" aria-valuemin="0" aria-valuemax="25" aria-valuenow="0">
        <div id="tl-fill"></div><div id="tl-ticks"></div><div id="tl-head"></div>
      </div>
      <div id="tl-labels"></div>
    </div>
  </footer>
</div>
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/earcut.min.js"></script>
<script src="vendor/milsymbol.js"></script>
<script src="js/gl.js?v=2.10.0"></script>
<script src="app.js?v=2.10.0"></script>
</body>
</html>
